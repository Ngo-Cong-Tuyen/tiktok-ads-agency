<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Inquiry</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f3f4f6;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

.form-box{
  background:white;
  padding:30px;
  width:420px;
  border-radius:10px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
}

label{
  display:block;
  margin-top:15px;
  font-weight:bold;
}

input, select, textarea{
  width:100%;
  padding:10px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:6px;
}

textarea{
  height:100px;
}

button{
  margin-top:20px;
  width:100%;
  padding:12px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:6px;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#1e40af;
}

#msg{
  margin-top:15px;
  text-align:center;
}
</style>

</head>

<body>

<div class="form-box">

<h2>Marketing Inquiry</h2>

<form id="contactForm">

<label>Name</label>
<input type="text" id="name" required>

<label>Email</label>
<input type="email" id="email" required>

<label>Monthly Ad Budget</label>
<input type="text" id="budget">

<label>Business Type</label>
<select id="businessType">
<option value="">Select...</option>
<option>E-commerce</option>
<option>Local Business</option>
<option>Service</option>
<option>Agency</option>
<option>Other</option>
</select>

<label>Tell us about your goals</label>
<textarea id="goals"></textarea>

<button type="submit">Submit</button>

<div id="msg"></div>

</form>

</div>

<script>

const form = document.getElementById("contactForm");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  const payload = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    budget: document.getElementById("budget").value,
    businessType: document.getElementById("businessType").value,
    goals: document.getElementById("goals").value
  };

  try {

    const res = await fetch("/api/contact", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if(data.success){
      msg.style.color = "green";
      msg.innerText = "Inquiry submitted successfully!";
      form.reset();
    } else {
      msg.style.color = "red";
      msg.innerText = data.error || "Submission failed";
    }

  } catch(err){
    msg.style.color = "red";
    msg.innerText = "Server error";
  }

});

</script>

</body>
</html>
